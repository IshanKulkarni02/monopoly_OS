name: Build desktop installers

# PyInstaller can't cross-compile — a Windows .exe has to actually be built
# on Windows, same as the .dmg has to be built on macOS. Manual trigger by
# default (these are large binary artifacts; no reason to build them on
# every push) plus version tags, so cutting a `vX.Y.Z` tag produces both
# installers automatically.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build
        run: python scripts/build_desktop.py

      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: monopoly_OS-macos
          path: dist/monopoly_OS.dmg

      - name: Upload Windows .exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: monopoly_OS-windows
          path: dist/monopoly_OS.exe
